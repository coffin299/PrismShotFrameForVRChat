[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismshot"
version = "1.0.0"
description = "PrismShotFrame Studio"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "onnxruntime-directml>=1.17",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "python-osc>=1.8",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prismshot = "prismshot.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prismshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
